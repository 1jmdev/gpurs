[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/1jmdev/gpurs"

[workspace.dependencies]
fixedbitset = "0.5"
bitflags = "2.13.2"
gpurs = { path = "crates/gpurs" }
gpurs-artifact = { path = "crates/artifact" }
gpurs-build = { path = "crates/build" }
gpurs-codegen = { path = "crates/codegen" }
gpurs-driver = { path = "crates/driver" }
gpurs-frontend = { path = "crates/frontend" }
gpurs-ir = { path = "crates/ir" }
gpurs-macros = { path = "crates/macros" }
gpurs-nvvm = { path = "crates/nvvm" }
gpurs-rustc = { path = "crates/rustc" }
gpurs-verifier = { path = "crates/verifier" }
libc = "0.2"
libloading = "0.9.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full", "visit", "visit-mut"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(gpurs_device)"] }
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
assigning_clones = "warn"
borrow_as_ptr = "warn"
doc_markdown = "warn"
elidable_lifetime_names = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_for_each = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
unnested_or_patterns = "warn"
